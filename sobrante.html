<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Producción</title>
    <link rel="stylesheet" href="style4.css?v=20261001">
    <link rel="stylesheet" href="salir.css">
</head>
<body>
    <div class="container">
        <header class="app-header">
            <img src="https://www.romeropanificados.com.ar/wp-content/uploads/2023/01/Recurso-8.png"
                 alt="Romero Panificados" class="header-icon">
            <div class="header-acciones">
                <a href="lista.html" class="boton-volver">← Volver a Lista</a>
                <button type="button" class="btn-salir" data-salir aria-label="Cerrar sesión" title="Cerrar sesión"><svg class="ico-salir" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg><span>Salir</span></button>
            </div>
        </header>
        <h1>Control de Producción</h1>
        <section id="ingrese-los-restantes">
            <h2>Ingresar Producción</h2>
            <div class="form-grid">
                <div class="form-group">
                    <label>Marca</label>
                    <select id="sel-marca" onchange="actualizarLinea()">
                        <option value="" disabled selected>-- Marca --</option>
                        <option value="romero">Romero</option>
                        <option value="roxy">The Roxy</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Línea</label>
                    <select id="sel-linea" disabled onchange="actualizarProducto()">
                        <option value="" disabled selected>-- Línea --</option>
                    </select>
                </div>
                <div class="form-group full">
                    <label>Producto</label>
                    <select id="sel-producto" disabled onchange="actualizarInfo()">
                        <option value="" disabled selected>-- Producto --</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Filas completas</label>
                    <input type="number" id="inp-filas" min="0" placeholder="Cant. de filas" oninput="calcularTotal()" disabled>
                </div>
                <div class="form-group">
                    <label>Bandejas sueltas</label>
                    <input type="number" id="inp-bandejas" min="0" max="13" placeholder="Bandejas sin completar fila" oninput="calcularTotal()" disabled>
                </div>
                <div class="form-group full">
                    <label>Paquetes sueltos</label>
                    <input type="number" id="inp-incompletos" min="0" placeholder="Paq. de bandeja incompleta" oninput="calcularTotal()" disabled>
                </div>
            </div>
            <div class="bandeja-info" id="bandeja-info">
                🍞 <span id="bandeja-texto"></span>
            </div>
            <div class="total-box" id="total-box">
                <span class="total-label">Total de paquetes</span>
                <span class="total-numero" id="total-numero">0</span>
                <span class="total-detalle" id="total-detalle"></span>
            </div>
            <button id="guardar-sobrante-btn" disabled>Guardar</button>
        </section>
        <div id="lista-sobrantes-admin" class="task-list-container">
            <h2>Producción Registrada</h2>
            <ul id="taskList"></ul>
        </div>
    </div>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    <script src="jornada.js?v=20261008"></script>
    <script src="sobrantes-stock.js?v=20261008"></script>
    <script src="stock-sync.js?v=20261008"></script>
    <script src="sobrante.js?v=20261008"></script>
    <script src="salir.js"></script>
</body>
</html>
